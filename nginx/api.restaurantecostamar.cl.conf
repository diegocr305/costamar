# ================================================================
# Nginx host — API: api.restaurantecostamar.cl
# Proxy hacia el contenedor costamar-api (NestJS, :3000)
# Instalar en: /etc/nginx/sites-available/api.restaurantecostamar.cl
# ================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.restaurantecostamar.cl;
    return 301 https://api.restaurantecostamar.cl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.restaurantecostamar.cl;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
