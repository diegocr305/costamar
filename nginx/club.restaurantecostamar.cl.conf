# ================================================================
# Nginx host — Club PWA: club.restaurantecostamar.cl
# Proxy hacia el contenedor costamar-club (PWA nginx, :4002)
# Instalar en: /etc/nginx/sites-available/club.restaurantecostamar.cl
# Nota: requiere crear el registro DNS 'club' en Cloudflare antes de activar.
# ================================================================

server {
    listen 80;
    listen [::]:80;
    server_name club.restaurantecostamar.cl;
    return 301 https://club.restaurantecostamar.cl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 omitido: "http2 on;" no existe en Nginx 1.24.0. Estabilidad primero.
    server_name club.restaurantecostamar.cl;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
