# ================================================================
# Nginx host — Web pública: restaurantecostamar.cl + www
# Proxy hacia el contenedor costamar-web (Angular SSR, :4000)
# Instalar en: /etc/nginx/sites-available/restaurantecostamar.cl
# ================================================================

# Redirección HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name restaurantecostamar.cl www.restaurantecostamar.cl;
    return 301 https://restaurantecostamar.cl$request_uri;
}

# Redirección www → raíz (sobre HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 omitido: la directiva "http2 on;" no existe en Nginx 1.24.0.
    # Cloudflare ofrece HTTP/2/3 al visitante en el borde; el tramo
    # Cloudflare→origen con HTTP/1.1 sobre TLS es suficiente y estable.
    server_name www.restaurantecostamar.cl;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    return 301 https://restaurantecostamar.cl$request_uri;
}

# Servidor principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 omitido por compatibilidad con Nginx 1.24.0 (ver nota arriba).
    server_name restaurantecostamar.cl;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
