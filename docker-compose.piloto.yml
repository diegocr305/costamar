# ================================================================
# COSTA MAR PLATFORM — Despliegue PILOTO (solo web + API)
# Levanta únicamente la web pública y la API, más ligero para los
# 4 GB del servidor. admin y club se añaden después.
#
# Uso en el servidor:
#   docker compose -f docker-compose.piloto.yml up -d --build
# ================================================================

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: costamar/api:latest
    container_name: costamar-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SUPABASE_URL: ${SUPABASE_URL:?Falta SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Falta SUPABASE_SERVICE_ROLE_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Falta ALLOWED_ORIGINS}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - costamar_net
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: costamar/web:latest
    container_name: costamar-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      SSR_ALLOWED_HOSTS: ${SSR_ALLOWED_HOSTS:-restaurantecostamar.cl,www.restaurantecostamar.cl,localhost,127.0.0.1}
      # URL de la API para el render SSR. Debe coincidir con la URL pública
      # que usa el navegador para que la transfer cache de hidratación
      # reutilice la respuesta y el cliente no vuelva a pedir.
      SSR_API_URL: http://host.docker.internal:3000/api/v1
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - costamar_net
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M

  # Club Costa Mar (PWA estática servida por Nginx). No usa secretos:
  # la clave publishable y la URL de API son públicas y van en el build.
  club:
    build:
      context: .
      dockerfile: apps/club/Dockerfile
    image: costamar/club:latest
    container_name: costamar-club
    restart: unless-stopped
    ports:
      - "127.0.0.1:4002:4002"
    # Nginx interno escucha en 4002. Usar 127.0.0.1 (IPv4): "localhost"
    # puede resolver a ::1 (IPv6) dentro del contenedor y fallar el chequeo.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4002/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - costamar_net
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  costamar_net:
    driver: bridge
