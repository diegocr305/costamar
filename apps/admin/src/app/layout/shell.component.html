<div class="shell">
  <aside class="sidebar">
    <a routerLink="/dashboard" class="sidebar__brand"><img src="assets/brand/costamar-logo.png" alt="Costa Mar" width="56" height="56" /><span><strong>Costa Mar</strong><small>Equipo del restaurante</small></span></a>
    <span class="sidebar__eyebrow">Tu espacio de atención</span>
    <nav class="sidebar__nav" aria-label="Secciones del panel">
      @for (s of sections(); track s.path) {
        <a [routerLink]="s.path" routerLinkActive="active" ariaCurrentWhenActive="page"><span aria-hidden="true">{{ icon(s.path) }}</span>{{ s.label }}</a>
      }
    </nav>
    <div class="sidebar__foot">Cada visita cuenta.<br /><span>Atendamos con sabor Costa Mar.</span></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar__welcome">Bienvenido al equipo</span>
      <span class="topbar__user">
        {{ user()?.email }}
        <span class="topbar__role">{{ roleLabel(user()?.role) }}</span>
      </span>
      <button type="button" class="logout" (click)="logout()">
        Cerrar sesión
      </button>
    </header>

    <section class="content">
      <router-outlet></router-outlet>
    </section>
  </div>
</div>
